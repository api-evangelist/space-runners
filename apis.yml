description: 'Space Runners is a digital fashion company that designs and launches digital wearable
  NFTs for metaverses in collaboration with celebrities and brands. Positioned at the intersection of
  Web3, gaming, and consumer fashion, the company produces branded digital sneakers, apparel, and
  wearable collectibles for use across metaverse platforms. Backed by Accel and Pantera Capital, Space
